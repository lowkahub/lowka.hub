<style>

 header{padding:10px 18px}header h1{font-size:19px}

</style></head><body><noscript>Для роботи магазину увімкніть JavaScript.</noscript><div id="app"></div><div id="st"></div>
<script>
/* ===== ПІДКЛЮЧЕННЯ ДО ХМАРИ (адреса бази Firebase). Заповнюється в адмінці кнопкою «Завантажити файл із підключенням» ===== */
const DB_URL='https://lowkahub-9d933-default-rtdb.europe-west1.firebasedatabase.app';
const NS='shop@'+location.pathname.replace(/index\.html$/,'')+'|';

const SRC='<!DOCTYPE html>'+document.documentElement.outerHTML;
const SALT='shop|';
const DEF_HASH='8c51d3f27c18380f8624ea62047f480c8419a05dae3c146232e56bb8a4f5ca23';

/* ---------- SHA-256 (працює і без https) ---------- */
function sha256(s){s=unescape(encodeURIComponent(s));
 function rr(v,a){return(v>>>a)|(v<<(32-a))}
 var mp=Math.pow,mw=mp(2,32),i,j,result='',words=[],al=s.length*8;
 var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={};
 for(var cand=2;pc<64;cand++){if(!ic[cand]){for(i=0;i<313;i+=cand)ic[i]=cand;hash[pc]=(mp(cand,.5)*mw)|0;k[pc++]=(mp(cand,1/3)*mw)|0}}
 s+='\x80';while(s.length%64-56)s+='\x00';
 for(i=0;i<s.length;i++){j=s.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((al/mw)|0);words[words.length]=al;
 for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
  for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
 return result}
const hp=pw=>sha256(SALT+pw);

/* ---------- дані ---------- */
const COND=[['new','Нове'],['ex','Відмінний стан'],['good','Добрий стан']];
const GEN=[['m','Чоловіче'],['f','Жіноче'],['u','Унісекс']];
const DEF=()=>({s:{name:'Мій магазин',color:'#111111',tg:'',card:'',holder:'',cur:'₴',about:'Одяг з доставкою по Україні',logo:'',cn:'',cp:'',
 cats:['Худі','Футболки','Штани','Джинси','Куртки','Светри','Взуття','Аксесуари'],p3on:true,p3max:500,fsOn:true},
 p:[{id:'demo',t:0,n:'Худі оверсайз',pr:900,d:'Щільний фліс, вільний крій. Це приклад товару: видаліть або змініть його в адмінці.',sz:['S','M','L','XL'],kind:'c',im:[],sold:false,g:'u',cat:'Худі',cond:'new',sp:0,se:0}],
 r:{},fv:{}});
let D=DEF();
let cart=[],modal=null,admin=false,tab='p',loggedIn=false,busy=false;
const F0=()=>({open:false,q:'',g:'',cats:[],sz:[],sh:[],cond:[],min:'',max:''});
let F=F0();
const app=document.getElementById('app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('uk-UA')+' '+esc(D.s.cur);
const prod=id=>D.p.find(p=>p.id===id);
const curHash=()=>D.s.ph||DEF_HASH;
const isSale=p=>p.sp>0&&p.sp<p.pr&&(!p.se||p.se>Date.now());
const effP=p=>isSale(p)?p.sp:p.pr;
const isRes=p=>!!(D.r&&D.r[p.id]);
const avail=p=>!!p&&!p.sold&&!isRes(p);
const LS={get(k){try{return localStorage.getItem(NS+k)}catch(e){return null}},set(k,v){try{localStorage.setItem(NS+k,v)}catch(e){}},del(k){try{localStorage.removeItem(NS+k)}catch(e){}}};
const base=()=>(DB_URL||LS.get('dburl')||'').trim().replace(/\/+$/,'');
const arr=v=>v?(Array.isArray(v)?v:Object.values(v)):[];
function norm(x){const d=DEF(),s=Object.assign(d.s,x&&x.s||{});
 s.cats=arr(s.cats).filter(Boolean);s.p3on=!!s.p3on;s.fsOn=!!s.fsOn;s.p3max=isFinite(+s.p3max)?+s.p3max:500;s.logo=s.logo||'';s.cn=s.cn||'';s.cp=s.cp||'';
 let p=arr(x&&x.p);
 p=p.filter(Boolean).map(q=>({id:q.id,t:q.t||0,n:q.n||'',pr:+q.pr||0,d:q.d||'',sz:arr(q.sz).map(String),kind:q.kind==='s'||(!q.kind&&q.cat==='Взуття')?'s':'c',im:arr(q.im),sold:!!q.sold,sa:+q.sa||0,g:q.g||'',cat:q.cat||'',cond:q.cond||'',sp:+q.sp||0,se:+q.se||0}));
 p.sort((a,b)=>b.t-a.t);
 const r={};if(x&&x.r&&typeof x.r==='object')Object.keys(x.r).forEach(k=>{if(x.r[k])r[k]=+x.r[k]||1});
 return{s,p,r,fv:normFv(x&&x.fv)}}
function normFv(x){const o={};if(x&&typeof x==='object')Object.keys(x).forEach(p=>{const v=x[p];if(v&&typeof v==='object'){const c={};Object.keys(v).forEach(k=>{if(v[k])c[k]=1});if(Object.keys(c).length)o[p]=c}});return o}

/* ---------- локальне сховище (IndexedDB, без ліміту 5 МБ) ---------- */
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open(NS,1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
async function idbGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('k').objectStore('k').get('D');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbSet(v){try{const d=await idb();return await new Promise(res=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(Object.assign({},v,{_v:VER,_rv:RVER}),'D');t.oncomplete=()=>res();t.onerror=()=>res()})}catch(e){}}

/* ---------- хмара (Firebase Realtime Database через звичайний fetch) ---------- */
let stT;
function status(t,err){const e=document.getElementById('st');if(!e)return;e.textContent=t;e.className=err?'err':'';e.style.display='block';clearTimeout(stT);stT=setTimeout(()=>e.style.display='none',err?6000:2200)}
/* Версії: /shop/v — змінюється при правці каталогу (товари/налаштування), /shop/rv — при зміні броней/обраного.
   Це кілька байтів: клієнт качає великі дані лише тоді, коли версія відрізняється від збереженої в браузері. */
let VER=null,RVER=null;
const RVP=/^\/shop\/(r|fv)(\/|$)/;
async function bumpRv(){try{await fetch(base()+'/shop/rv.json?print=silent',{method:'PUT',body:JSON.stringify(Date.now())})}catch(e){}}
async function cput(path,val){const r=await fetch(base()+path+'.json?print=silent',{method:'PUT',body:JSON.stringify(val)});if(!r.ok)throw new Error(r.status);if(RVP.test(path))bumpRv()}
async function cdel(path){const r=await fetch(base()+path+'.json',{method:'DELETE'});if(!r.ok)throw new Error(r.status);if(RVP.test(path))bumpRv()}
async function cget(path){const r=await fetch(base()+path+'.json');if(!r.ok)throw new Error(r.status);return r.json()}
async function cloudLoad(){const [s0,p0,r0,f0]=await Promise.all([cget('/shop/s'),cget('/shop/p'),cget('/shop/r'),cget('/shop/fv')]);return{s:s0,p:p0,r:r0,fv:f0}}
let dS=false,dP=new Set(),dDel=new Set(),tm;
function mark(kind,id){theme();if(kind==='s')dS=true;else if(kind==='p')dP.add(id);else if(kind==='del'){dP.delete(id);dDel.add(id)}
 LS.set('pending','1');status('Збереження…');clearTimeout(tm);tm=setTimeout(flush,600)}
function markAll(){dS=true;D.p.forEach(p=>dP.add(p.id));LS.set('pending','1')}
async function flush(){
 await idbSet(D);
 if(!base()){LS.del('pending');status('Збережено на цьому пристрої');return}
 try{
  if(dS){await cput('/shop/s',D.s);dS=false}
  for(const id of [...dP]){const p=prod(id);if(p)await cput('/shop/p/'+id,p);dP.delete(id)}
  for(const id of [...dDel]){await cdel('/shop/p/'+id);await cdel('/shop/r/'+id).catch(()=>{});await cdel('/shop/fv/'+id).catch(()=>{});dDel.delete(id)}
  const nv=Date.now();await cput('/shop/v',nv);VER=nv;idbSet(D);
  LS.del('pending');status('Збережено ✓')
 }catch(e){status('Не вдалося зберегти в хмару. Перевірте інтернет і налаштування бази',1)}}

/* ---------- вхід ---------- */
const checkLogin=()=>{loggedIn=LS.get('adm')===curHash()};
async function init(){
 const l=await idbGet();if(l){D=norm(l);VER=l._v!=null?l._v:null;RVER=l._rv!=null?l._rv:null}
 checkLogin();admin=loggedIn;render();
 restoreMe().then(()=>{if(!isTyping())render()});
 if(location.hash==='#admin'&&!loggedIn){modal={t:'login'};render()}
 if(base()){
  try{
   const pend=LS.get('pending')==='1'&&!!LS.get('adm');
   const v=await cget('/shop/v');
   if(l&&VER!==null&&v!==null&&v===VER&&!pend){          // каталог не змінювався — беремо з кешу, нічого не качаємо
    await syncR();
   }else{
    const rv=await cget('/shop/rv');
    const c=await cloudLoad();
    if(c&&c.s){
     if(pend){const keepR=D.r;markAll();D.r=Object.assign({},norm(c).r,keepR);D.fv=norm(c).fv;flush()}   // були незбережені правки власника
     else{D=norm(c);VER=v;RVER=rv;idbSet(D);if(v===null){const nv=Date.now();cput('/shop/v',nv).then(()=>{VER=nv;idbSet(D)}).catch(()=>{})}}

 document.body.appendChild(el);
 const img=el.querySelector('img'),ct=el.querySelector('.ct'),ims=p.im.slice();
 const S={i:Math.min(Math.max(0,i|0),ims.length-1),k:1,x:0,y:0},ptr=new Map();let d0=0,k0=1,tapT=0,tapX=0,tapY=0,mv=0,sx=0;
 const clamp=()=>{const mx=(S.k-1)*el.clientWidth/2,my=(S.k-1)*el.clientHeight/2;S.x=Math.max(-mx,Math.min(mx,S.x));S.y=Math.max(-my,Math.min(my,S.y));if(S.k<=1){S.x=0;S.y=0}};

 const zoomAt=(k,cx,cy)=>{k=Math.max(1,Math.min(5,k));const r=el.getBoundingClientRect(),ox=cx-r.left-r.width/2,oy=cy-r.top-r.height/2,f=k/S.k;S.x=ox-(ox-S.x)*f;S.y=oy-(oy-S.y)*f;S.k=k;draw()};
 const dist=()=>{const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};

function adminV(){
 const cl=base(),nr=D.p.filter(isRes).length,ns=D.p.filter(p=>p.sold).length;
 let h=cl?`<div class="ok">☁ Хмару підключено: зміни зберігаються автоматично й одразу видні всім за посиланням.</div>`

 const tb=(k,t)=>`<button class="${tab===k?'on':''}" onclick="tab='${k}';render()">${t}</button>`;
 h+=`<div class="tabs g4">${tb('p','📦 Товари')}${tb('r','🔒 Броні'+(nr?' ('+nr+')':''))}${tb('sd','✅ Продані'+(ns?' ('+ns+')':''))}${tb('d','🏷 Знижки')}${tb('s','⚙ Налаштування')}</div>`;
 if(tab==='s')return h+setV();
 if(tab==='d')return h+discV();

 return h+`<div class="row" style="margin-bottom:6px"><input id="aq" placeholder="🔍 Пошук товару за назвою" value="${esc(AQ)}" oninput="AQ=this.value;updAGrid()" style="margin:0"><button class="p" style="flex:none" onclick="newP()">+ Додати товар</button></div>

function edV(p){
 const cats=[['','— не вказано —'],...D.s.cats.map(c=>[c,c])],cs=p.cat&&!D.s.cats.includes(p.cat)?[...cats,[p.cat,p.cat]]:cats;
 const sale=p.sp>0?(p.sp<p.pr?(isSale(p)?`Знижка −${Math.round((1-p.sp/p.pr)*100)}% діє зараз`:'Термін знижки минув — вона не діє'):'<span style="color:#d33">Ціна зі знижкою має бути меншою за звичайну</span>'):'',

  <div class="row"><div><label>Стать</label><select onchange="upd('${id}','g',this.value)">${opts([['','— не вказано —'],...GEN],p.g)}</select></div><div><label>Стан</label><select onchange="upd('${id}','cond',this.value)">${opts([['','— не вказано —'],...COND],p.cond)}</select></div></div></div>
 <div class="box"><b>💰 Ціна</b>
  <div class="row"><div><label>Ціна</label><input type="number" inputmode="decimal" value="${p.pr}" onchange="upd('${id}','pr',+this.value)"></div><div><label>Ціна зі знижкою</label><input type="number" inputmode="decimal" value="${p.sp||''}" placeholder="без знижки" onchange="upd('${id}','sp',+this.value||0)"></div></div>
  <label>Знижка діє до (необов’язково)</label><input type="datetime-local" value="${p.se?locIn(p.se):''}" onchange="upd('${id}','se',this.value?new Date(this.value).getTime():0)">
  <small style="color:var(--mut)">Порожня дата — знижка діє без таймера. ${sale}</small>${p.se?`<br><button style="min-height:36px;margin:6px 0" onclick="upd('${id}','se',0);render()">Прибрати таймер</button>`:''}</div>
 <div class="box"><b>📏 Розміри</b>${hint('Натискайте на розміри, які є в наявності.')}
  <div class="chips">${SL.map(s=>`<button class="${p.sz.includes(s)?'on':''}" data-v="${s}" onclick="togSz('${id}',this.dataset.v)">${s}</button>`).join('')}</div>
  <label>Усі розміри через кому (можна дописати свій)</label><input value="${esc(p.sz.join(', '))}" onchange="updSz('${id}',this.value)"></div>
 <div class="box"><b>📷 Фото</b>
  <div>${p.im.map((s,i)=>`<span class="x"><img src="${s}" style="width:64px;height:64px;object-fit:cover;border-radius:8px" alt=""><button onclick="delImg('${id}',${i})">×</button></span>`).join('')}</div>
  <label>Додати фото</label><input type="file" accept="image/*" multiple onchange="addImg('${id}',this.files)"></div>
 <div class="box"><b>🔒 Статус</b>${hint('В обране додали: '+n+(isRes(p)?'. Заброньовано: '+new Date(D.r[id]).toLocaleString('uk-UA'):''))}
  <div class="row"><button onclick="setRes('${id}',${!isRes(p)});render()">${isRes(p)?'Зняти бронь':'Забронювати'}</button><button onclick="toggleSold('${id}')">${p.sold?'Повернути в продаж':'Позначити «Продано»'}</button></div></div>
 <button class="p" style="width:100%" onclick="closeM()">Готово</button>
 <button class="d" style="width:100%;margin-top:8px" onclick="delP('${id}')">Видалити товар</button>`}
function newP(){D.p.unshift({id:'p'+Date.now(),t:Date.now(),n:'Новий товар',pr:0,d:'',sz:[],kind:'c',im:[],sold:false,g:'u',cat:D.s.cats[0]||'',cond:'new',sp:0,se:0});mark('p',D.p[0].id);modal={t:'ed',id:D.p[0].id};render()}
function toggleSold(id){const p=prod(id);p.sold=!p.sold;p.sa=p.sold?Date.now():0;mark('p',id);render()}
async function setRes(id,on){if(on)D.r[id]=Date.now();else delete D.r[id];idbSet(D);
 if(!base()){status('Збережено на цьому пристрої');return}
 try{if(on)await cput('/shop/r/'+id,D.r[id]);else await cdel('/shop/r/'+id);status(on?'Забронювано ✓':'Бронь знято ✓')}
 catch(e){status('Не вдалося зберегти бронь у хмарі',1)}}
function delImg(id,i){const u=prod(id).im.splice(i,1)[0];mark('p',id);cdEnq([u]);render()}
function delP(id){if(confirm('Видалити товар остаточно? Його дані та фото буде видалено з бази й з Cloudinary.')){const im=(prod(id)||{im:[]}).im.slice();D.p=D.p.filter(x=>x.id!==id);delete D.r[id];delete D.fv[id];mark('del',id);cdEnq(im);modal=null;render()}}
function shrink(file,max,type){return new Promise((r,j)=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(type==='png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.75))};i.onerror=()=>j();i.src=u})}
async function upImg(d){if(!(D.s.cn&&D.s.cp))return d;
 try{const fd=new FormData();fd.append('file',d);fd.append('upload_preset',D.s.cp);
  const r=await fetch('https://api.cloudinary.com/v1_1/'+encodeURIComponent(D.s.cn)+'/image/upload',{method:'POST',body:fd});
  if(!r.ok)throw new Error(r.status);const j=await r.json();
  return j.secure_url.replace('/upload/','/upload/f_auto,q_auto/')}
 catch(e){status('Не вдалося завантажити в Cloudinary — фото збережено в базі',1);return d}}
async function addImg(id,files){status('Завантаження фото…');for(const f of files){try{prod(id).im.push(await upImg(await shrink(f,1000,'jpeg')))}catch(e){status('Не вдалося прочитати фото',1)}}mark('p',id);render()}
/* ---------- видалення фото з Cloudinary (підпис рахується в браузері адміна; секрет зберігається лише тут) ---------- */
function sha1(s){s=unescape(encodeURIComponent(s));const w=[],l=s.length*8,h=[0x67452301,0xEFCDAB89,0x98BADCFE,0x10325476,0xC3D2E1F0],rl=(v,n)=>(v<<n)|(v>>>(32-n));
 s+='\x80';while(s.length%64-56)s+='\x00';
 for(let i=0;i<s.length;i++)w[i>>2]|=s.charCodeAt(i)<<(24-(i%4)*8);
 w.push((l/4294967296)|0,l|0);
 for(let o=0;o<w.length;o+=16){const x=w.slice(o,o+16);for(let i=16;i<80;i++)x[i]=rl(x[i-3]^x[i-8]^x[i-14]^x[i-16],1);
  let a=h[0],b=h[1],c=h[2],d=h[3],e=h[4];
  for(let i=0;i<80;i++){let f,k;
   if(i<20){f=(b&c)|(~b&d);k=0x5A827999}else if(i<40){f=b^c^d;k=0x6ED9EBA1}else if(i<60){f=(b&c)|(b&d)|(c&d);k=0x8F1BBCDC}else{f=b^c^d;k=0xCA62C1D6}
   const t=(rl(a,5)+f+e+k+x[i])|0;e=d;d=c;c=rl(b,30);b=a;a=t}
  h[0]=(h[0]+a)|0;h[1]=(h[1]+b)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0}
 return h.map(v=>(v>>>0).toString(16).padStart(8,'0')).join('')}
function cldId(u){const m=/^https:\/\/res\.cloudinary\.com\/([^/]+)\/image\/upload\/(.+)$/.exec(u||'');if(!m)return null;
 let g=m[2].split('/'),v=g.findIndex(x=>/^v\d+$/.test(x));
 if(v>=0)g=g.slice(v+1);else while(g.length>1&&/^[a-z]{1,4}_[^/]*$/.test(g[0]))g.shift();
 g=g.map(x=>{try{return decodeURIComponent(x)}catch(e){return x}});
 g[g.length-1]=g[g.length-1].replace(/\.[^./]+$/,'');
 return{cloud:m[1],id:g.join('/')}}
const cdK=()=>({k:(LS.get('cdk')||'').trim(),s:(LS.get('cds')||'').trim()});
const cdQ=()=>{try{return JSON.parse(LS.get('cdq')||'[]')}catch(e){return[]}};
async function cldDel(id){const {k,s}=cdK(),ts=Math.floor(Date.now()/1000);
 const fd=new FormData();fd.append('public_id',id);fd.append('timestamp',ts);fd.append('api_key',k);fd.append('invalidate','true');
 fd.append('signature',sha1('invalidate=true&public_id='+id+'&timestamp='+ts+s));
 const r=await fetch('https://api.cloudinary.com/v1_1/'+encodeURIComponent(D.s.cn)+'/image/destroy',{method:'POST',body:fd});
 const j=await r.json().catch(()=>({}));
 if(!r.ok||(j.result!=='ok'&&j.result!=='not found'))throw new Error((j.error&&j.error.message)||r.status)}
function cdEnq(urls){const q=cdQ();urls.forEach(u=>{const r=cldId(u);if(r&&r.cloud===D.s.cn&&!q.includes(r.id))q.push(r.id)});LS.set('cdq',JSON.stringify(q));cdRun()}
let cdB=false;
async function cdRun(quiet){if(cdB)return;const q=cdQ();if(!q.length)return;const {k,s}=cdK();
 if(!(D.s.cn&&k&&s)){if(!quiet)status('Фото залишилися в Cloudinary: вкажіть API Key і API Secret в налаштуваннях — вони видаляться автоматично',1);return}
 cdB=true;let fail=0,last='';
 for(const id of q.slice()){try{await cldDel(id);LS.set('cdq',JSON.stringify(cdQ().filter(x=>x!==id)))}catch(e){fail++;last=e.message||''}}
 cdB=false;status(fail?'Не вдалося видалити фото з Cloudinary ('+last+'). Спробуємо ще раз пізніше':'Фото видалено з Cloudinary ✓',!!fail)}
function rmLogo(){const u=D.s.logo;setS('logo','');cdEnq([u]);render()}
async function migrateImgs(){if(!(D.s.cn&&D.s.cp)){status('Спочатку вкажіть Cloud name і Upload preset',1);return}
 if(!confirm('Перенести всі наявні фото з бази в Cloudinary?'))return;let n=0;status('Переносимо фото… це може зайняти хвилину');
 for(const p of D.p){let ch=false;for(let i=0;i<p.im.length;i++)if(p.im[i].startsWith('data:')){const u=await upImg(p.im[i]);if(!u.startsWith('data:')){p.im[i]=u;ch=true;n++}}if(ch)mark('p',p.id)}
 if(D.s.logo&&D.s.logo.startsWith('data:')){const u=await upImg(D.s.logo);if(!u.startsWith('data:')){D.s.logo=u;mark('s');n++}}
 status('Перенесено фото: '+n+' ✓');render()}
async function addLogo(f){if(!f)return;try{const old=D.s.logo;D.s.logo=await upImg(await shrink(f,240,'png'));mark('s');if(old&&old!==D.s.logo)cdEnq([old]);render()}catch(e){status('Не вдалося прочитати зображення',1)}}
async function connect(){const u=document.getElementById('dburl').value.trim().replace(/\/+$/,'');
 if(!u){LS.del('dburl');status('Хмару відключено');render();return}
 if(!/^https:\/\/.+/.test(u)){status('Адреса має починатися з https://',1);return}
 LS.set('dburl',u);
 try{const c=await cloudLoad();
  if(c&&c.s){if(confirm('У хмарі вже є дані магазину. Завантажити їх сюди? (Скасувати — перезаписати хмару поточними даними)')){D=norm(c);idbSet(D)}else{markAll();await flush()}}
  else{markAll();await flush()}
  status('Хмару підключено ✓');render()
 }catch(e){status('Не вдалося підключитися. Перевірте адресу й правила бази',1)}}
async function chpw(){const g=i=>document.getElementById(i).value;
 if(hp(g('pw0'))!==curHash()){status('Поточний пароль невірний',1);return}
 if(g('pw1').length<6){status('Новий пароль занадто короткий',1);return}
 if(g('pw1')!==g('pw2')){status('Паролі не збігаються',1);return}
 D.s.ph=hp(g('pw1'));LS.set('adm',D.s.ph);mark('s');status('Пароль змінено ✓');render()}
function dlFile(){const u=(LS.get('dburl')||DB_URL||'').trim();
 if(!u){status('Спочатку підключіть хмару',1);return}
 const h=SRC.replace(/const DB_URL='[^']*';/,()=>"const DB_URL='"+u.replace(/'/g,'')+"';");
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove()}
window.addEventListener('hashchange',()=>{if(location.hash==='#admin'&&!loggedIn){modal={t:'login'};render()}});
init();
</script></body></html>
