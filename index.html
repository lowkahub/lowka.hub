<!DOCTYPE html><html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="description" content="Інтернет-магазин одягу">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E🛍%3C/text%3E%3C/svg%3E">
<title>Мій магазин</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f4f5;--mut:#777;--bd:#e2e2e4;--acc:#111;color-scheme:light;box-sizing:border-box;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151517;--fg:#f1f1f1;--card:#222226;--mut:#9a9aa0;--bd:#34343a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151517;--fg:#f1f1f1;--card:#222226;--mut:#9a9aa0;--bd:#34343a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
img{max-width:100%}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
header h1{flex:1;margin:0;font-size:17px;min-width:0;display:flex;align-items:center;gap:8px}
header h1 span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lg{height:32px;width:auto;max-width:110px;object-fit:contain;flex:none;border-radius:6px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;min-height:44px;touch-action:manipulation}
header button{flex:none;padding:8px 12px}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.w{background:#fff;color:#111;border:1.5px solid #111;font-weight:600}
button.d{color:#d33}
button:disabled{opacity:.5}
main{max-width:960px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.c{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;position:relative;min-width:0}
.c .im,.big{aspect-ratio:3/4;background:linear-gradient(135deg,var(--bd),var(--card));display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px}
.c.na .im{opacity:.55}
.im img,.big img{width:100%;height:100%;object-fit:cover}
.c .t{padding:10px}.c b{display:block;overflow-wrap:anywhere;margin-bottom:4px}
.pr{display:inline-block;background:var(--acc);color:#fff;font-weight:700;border-radius:8px;padding:2px 9px}
.pr.sale{background:#d33}
.old{color:var(--mut);text-decoration:line-through;font-size:.85em;margin-left:6px;font-weight:400;white-space:nowrap}
.tm{display:block;color:#d33;font-size:12px;font-weight:600;margin-top:4px}
.sold,.rsv,.bdg{position:absolute;top:8px;border-radius:8px;padding:2px 8px;font-size:12px}
.sold{left:8px;background:#000a;color:#fff}
.rsv{left:8px;background:#f5a623;color:#000;font-weight:600}
.bdg{right:8px;background:#d33;color:#fff;font-weight:700}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--bg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sz{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.sz button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.chips button{min-height:36px;padding:6px 12px;font-size:14px;border-radius:18px;text-align:left}
.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.th{display:flex;gap:6px;margin:8px 0;overflow-x:auto}
.th img{width:54px;height:54px;flex:none;object-fit:cover;border-radius:8px;cursor:pointer}
input,textarea,select{font:inherit;font-size:16px;width:100%;padding:10px 12px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)}
input[type=checkbox]{width:auto;margin:0 8px 0 0;vertical-align:middle}
label{font-size:13px;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1;min-width:0}
.box{background:var(--card);border-radius:12px;padding:12px;margin:10px 0}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tabs button{flex:1}.tabs .on{background:var(--acc);color:#fff}
.x{display:inline-block;position:relative;margin:0 6px 6px 0}.x button{position:absolute;top:2px;right:2px;padding:0 7px;min-height:26px;border-radius:50%}
.warn{background:#f5a62333;border:1px solid #f5a623;border-radius:10px;padding:10px;margin-bottom:12px;font-size:14px}
.ok{background:#2e9e5b22;border:1px solid #2e9e5b;border-radius:10px;padding:10px;margin:10px 0;font-size:14px}
.promo{background:var(--card);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:14px}
.promo div+div{margin-top:4px}
.card{font-size:20px;letter-spacing:1px;font-weight:700;margin:6px 0;overflow-wrap:anywhere}
footer{text-align:center;padding:24px 0 8px;font-size:12px}
footer a{color:var(--mut);cursor:pointer;text-decoration:underline}
#st{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#222;color:#fff;border-radius:20px;padding:7px 16px;font-size:13px;z-index:50;display:none;max-width:90vw;text-align:center}
#st.err{background:#c0392b}
ol{padding-left:20px;margin:6px 0}
code{overflow-wrap:anywhere}
noscript{display:block;padding:20px;text-align:center}

/* ---- планшет ---- */
@media(min-width:600px){
 header{padding:10px 18px}header h1{font-size:19px}
 main{padding:18px}
 .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:18px}}
/* ---- десктоп ---- */
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(hover:hover){button:not(:disabled):hover{filter:brightness(.96)}.c:hover{box-shadow:0 2px 12px #0002}}
</style></head><body><noscript>Для роботи магазину увімкніть JavaScript.</noscript><div id="app"></div><div id="st"></div>
<script>
/* ===== ПІДКЛЮЧЕННЯ ДО ХМАРИ (адреса бази Firebase). Заповнюється в адмінці кнопкою «Завантажити файл із підключенням» ===== */
const DB_URL='https://lowkahub-9d933-default-rtdb.europe-west1.firebasedatabase.app';
const NS='shop@'+location.pathname.replace(/index\.html$/,'')+'|';

const SRC='<!DOCTYPE html>'+document.documentElement.outerHTML;
const SALT='shop|';
const DEF_HASH='8c51d3f27c18380f8624ea62047f480c8419a05dae3c146232e56bb8a4f5ca23';

/* ---------- SHA-256 (працює і без https) ---------- */
function sha256(s){s=unescape(encodeURIComponent(s));
 function rr(v,a){return(v>>>a)|(v<<(32-a))}
 var mp=Math.pow,mw=mp(2,32),i,j,result='',words=[],al=s.length*8;
 var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length,ic={};
 for(var cand=2;pc<64;cand++){if(!ic[cand]){for(i=0;i<313;i+=cand)ic[i]=cand;hash[pc]=(mp(cand,.5)*mw)|0;k[pc++]=(mp(cand,1/3)*mw)|0}}
 s+='\x80';while(s.length%64-56)s+='\x00';
 for(i=0;i<s.length;i++){j=s.charCodeAt(i);words[i>>2]|=j<<((3-i)%4)*8}
 words[words.length]=((al/mw)|0);words[words.length]=al;
 for(j=0;j<words.length;){var w=words.slice(j,j+=16),oh=hash;hash=hash.slice(0,8);
  for(i=0;i<64;i++){var w15=w[i-15],w2=w[i-2],a=hash[0],e=hash[4];
   var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]+(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
   var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
   hash=[(t1+t2)|0].concat(hash);hash[4]=(hash[4]+t1)|0}
  for(i=0;i<8;i++)hash[i]=(hash[i]+oh[i])|0}
 for(i=0;i<8;i++)for(j=3;j+1;j--){var b=(hash[i]>>(j*8))&255;result+=((b<16)?0:'')+b.toString(16)}
 return result}
const hp=pw=>sha256(SALT+pw);

/* ---------- дані ---------- */
const COND=[['new','Нове'],['ex','Відмінний стан'],['good','Добрий стан']];
const GEN=[['m','Чоловіче'],['f','Жіноче'],['u','Унісекс']];
const DEF=()=>({s:{name:'Мій магазин',color:'#111111',tg:'',card:'',holder:'',cur:'₴',about:'Одяг з доставкою по Україні',logo:'',
 cats:['Худі','Футболки','Штани','Джинси','Куртки','Светри','Взуття','Аксесуари'],p3on:true,p3max:500,fsOn:true},
 p:[{id:'demo',t:0,n:'Худі оверсайз',pr:900,d:'Щільний фліс, вільний крій. Це приклад товару: видаліть або змініть його в адмінці.',sz:['S','M','L','XL'],im:[],sold:false,g:'u',cat:'Худі',cond:'new',sp:0,se:0}],
 r:{}});
let D=DEF();
let cart=[],modal=null,admin=false,tab='p',loggedIn=false,busy=false;
const F0=()=>({open:false,q:'',g:'',cats:[],sz:[],cond:[],min:'',max:''});
let F=F0();
const app=document.getElementById('app');
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('uk-UA')+' '+esc(D.s.cur);
const prod=id=>D.p.find(p=>p.id===id);
const curHash=()=>D.s.ph||DEF_HASH;
const isSale=p=>p.sp>0&&p.sp<p.pr&&(!p.se||p.se>Date.now());
const effP=p=>isSale(p)?p.sp:p.pr;
const isRes=p=>!!(D.r&&D.r[p.id]);
const avail=p=>!!p&&!p.sold&&!isRes(p);
const LS={get(k){try{return localStorage.getItem(NS+k)}catch(e){return null}},set(k,v){try{localStorage.setItem(NS+k,v)}catch(e){}},del(k){try{localStorage.removeItem(NS+k)}catch(e){}}};
const base=()=>(DB_URL||LS.get('dburl')||'').trim().replace(/\/+$/,'');
const arr=v=>v?(Array.isArray(v)?v:Object.values(v)):[];
function norm(x){const d=DEF(),s=Object.assign(d.s,x&&x.s||{});
 s.cats=arr(s.cats).filter(Boolean);s.p3on=!!s.p3on;s.fsOn=!!s.fsOn;s.p3max=isFinite(+s.p3max)?+s.p3max:500;s.logo=s.logo||'';
 let p=arr(x&&x.p);
 p=p.filter(Boolean).map(q=>({id:q.id,t:q.t||0,n:q.n||'',pr:+q.pr||0,d:q.d||'',sz:arr(q.sz),im:arr(q.im),sold:!!q.sold,g:q.g||'',cat:q.cat||'',cond:q.cond||'',sp:+q.sp||0,se:+q.se||0}));
 p.sort((a,b)=>b.t-a.t);
 const r={};if(x&&x.r&&typeof x.r==='object')Object.keys(x.r).forEach(k=>{if(x.r[k])r[k]=+x.r[k]||1});
 return{s,p,r}}

/* ---------- локальне сховище (IndexedDB, без ліміту 5 МБ) ---------- */
const idb=()=>new Promise((res,rej)=>{try{const r=indexedDB.open(NS,1);r.onupgradeneeded=()=>r.result.createObjectStore('k');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});
async function idbGet(){try{const d=await idb();return await new Promise(res=>{const q=d.transaction('k').objectStore('k').get('D');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function idbSet(v){try{const d=await idb();return await new Promise(res=>{const t=d.transaction('k','readwrite');t.objectStore('k').put(v,'D');t.oncomplete=()=>res();t.onerror=()=>res()})}catch(e){}}

/* ---------- хмара (Firebase Realtime Database через звичайний fetch) ---------- */
let stT;
function status(t,err){const e=document.getElementById('st');if(!e)return;e.textContent=t;e.className=err?'err':'';e.style.display='block';clearTimeout(stT);stT=setTimeout(()=>e.style.display='none',err?6000:2200)}
async function cput(path,val){const r=await fetch(base()+path+'.json',{method:'PUT',body:JSON.stringify(val)});if(!r.ok)throw new Error(r.status)}
async function cdel(path){const r=await fetch(base()+path+'.json',{method:'DELETE'});if(!r.ok)throw new Error(r.status)}
async function cget(path){const r=await fetch(base()+path+'.json');if(!r.ok)throw new Error(r.status);return r.json()}
const cloudLoad=()=>cget('/shop');
let dS=false,dP=new Set(),dDel=new Set(),tm;
function mark(kind,id){theme();if(kind==='s')dS=true;else if(kind==='p')dP.add(id);else if(kind==='del'){dP.delete(id);dDel.add(id)}
 LS.set('pending','1');status('Збереження…');clearTimeout(tm);tm=setTimeout(flush,600)}
function markAll(){dS=true;D.p.forEach(p=>dP.add(p.id));LS.set('pending','1')}
async function flush(){
 await idbSet(D);
 if(!base()){LS.del('pending');status('Збережено на цьому пристрої');return}
 try{
  if(dS){await cput('/shop/s',D.s);dS=false}
  for(const id of [...dP]){const p=prod(id);if(p)await cput('/shop/p/'+id,p);dP.delete(id)}
  for(const id of [...dDel]){await cdel('/shop/p/'+id);await cdel('/shop/r/'+id).catch(()=>{});dDel.delete(id)}
  LS.del('pending');status('Збережено ✓')
 }catch(e){status('Не вдалося зберегти в хмару. Перевірте інтернет і налаштування бази',1)}}

/* ---------- вхід ---------- */
const checkLogin=()=>{loggedIn=LS.get('adm')===curHash()};
async function init(){
 const l=await idbGet();if(l)D=norm(l);
 checkLogin();admin=loggedIn;render();
 if(location.hash==='#admin'&&!loggedIn){modal={t:'login'};render()}
 if(base()){
  try{const c=await cloudLoad();
   if(c&&c.s){
    if(LS.get('pending')==='1'&&LS.get('adm')){const keepR=D.r;markAll();D.r=Object.assign({},norm(c).r,keepR);flush()}   // були незбережені правки власника
    else{D=norm(c);idbSet(D)}
   }else if(LS.get('adm')){markAll();flush()}                        // хмара порожня: заливаємо дані
   checkLogin();if(!loggedIn)admin=false;render();
  }catch(e){}
 }}
async function login(){const v=document.getElementById('lp').value;
 if(hp(v)===curHash()){LS.set('adm',curHash());loggedIn=true;admin=true;modal=null;history.replaceState(null,'',location.pathname+location.search);render()}
 else{status('Невірний пароль',1)}}
function logout(){LS.del('adm');loggedIn=false;admin=false;render()}

/* ---------- допоміжне ---------- */
const pad=n=>String(n).padStart(2,'0');
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+' д ':'')+pad(h)+':'+pad(m)+':'+pad(s%60)}
const locIn=ts=>{const d=new Date(ts);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)};
const isTyping=()=>{const a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)};
const gName=v=>(GEN.find(x=>x[0]===v)||[,''])[1];
const cName=v=>(COND.find(x=>x[0]===v)||[,''])[1];
function tick(){const now=Date.now();let exp=false;
 document.querySelectorAll('[data-e]').forEach(e=>{const l=+e.dataset.e-now;if(l<=0)exp=true;else e.textContent=fmt(l)});
 if(exp&&!isTyping())render()}
setInterval(tick,1000);
const SZO=['XXS','XS','S','M','L','XL','XXL','XXXL','3XL','4XL','5XL'];
function cmpSz(a,b){const ia=SZO.indexOf(String(a).toUpperCase()),ib=SZO.indexOf(String(b).toUpperCase());
 if(ia>=0&&ib>=0)return ia-ib;if(ia>=0)return -1;if(ib>=0)return 1;
 const na=parseFloat(a),nb=parseFloat(b);if(!isNaN(na)&&!isNaN(nb)&&na!==nb)return na-nb;return String(a).localeCompare(String(b),'uk')}
const allSizes=()=>[...new Set(D.p.flatMap(p=>p.sz))].sort(cmpSz);

/* ---------- вигляд ---------- */
function theme(){document.documentElement.style.setProperty('--acc',D.s.color);document.title=D.s.name;const m=document.querySelector('meta[name=theme-color]');if(m)m.content=D.s.color}
function purge(){const n=cart.length;cart=cart.filter(i=>avail(prod(i.id)));if(cart.length!==n)status('Деякі товари вже недоступні й видалені з кошика',1)}
function render(){theme();if(modal&&(modal.t==='cart'||modal.t==='co'))purge();
 document.body.style.overflow=modal?'hidden':'';
 const cnt=cart.reduce((a,i)=>a+i.q,0);
 app.innerHTML=`<header><h1>${D.s.logo?`<img class="lg" src="${D.s.logo}" alt="">`:''}<span>${esc(D.s.name)}</span></h1>${loggedIn?`<button onclick="admin=!admin;render()">${admin?'Магазин':'⚙ Адмін'}</button>`:''}<button onclick="modal={t:'cart'};render()">🛒 ${cnt||''}</button></header><main>${admin&&loggedIn?adminV():shopV()}</main>${modalV()}`;
 tick()}
const priceH=p=>`<span class="pr${isSale(p)?' sale':''}">${money(effP(p))}</span>${isSale(p)?`<span class="old">${money(p.pr)}</span>`:''}`;
const tmH=p=>isSale(p)&&p.se?`<span class="tm">⏳ до кінця акції: <span data-e="${p.se}">${fmt(p.se-Date.now())}</span></span>`:'';
function promoH(){const a=[];
 if(D.s.p3on)a.push(`🎁 Купуйте 2 речі — будь-яка третя вартістю до ${money(D.s.p3max)} безкоштовно`);
 if(D.s.fsOn)a.push('🚚 Безкоштовна доставка при повній передоплаті');
 return a.length?`<div class="promo">${a.map(x=>`<div>${x}</div>`).join('')}</div>`:''}

/* ---------- фільтри ---------- */
function filt(){const q=F.q.trim().toLowerCase(),mn=F.min===''?null:+F.min,mx=F.max===''?null:+F.max;
 return D.p.filter(p=>{
  if(q&&!p.n.toLowerCase().includes(q))return false;
  if(F.g&&p.g&&p.g!=='u'&&p.g!==F.g)return false;
  if(F.cats.length&&!F.cats.includes(p.cat))return false;
  if(F.cond.length&&!F.cond.includes(p.cond))return false;
  if(F.sz.length&&!p.sz.some(s=>F.sz.includes(s)))return false;
  const e=effP(p);if(mn!==null&&e<mn)return false;if(mx!==null&&e>mx)return false;return true})}
const fcount=()=>(F.g?1:0)+(F.cats.length?1:0)+(F.sz.length?1:0)+(F.cond.length?1:0)+((F.min!==''||F.max!=='')?1:0);
function tg(k,v){if(k==='g')F.g=v;else{const a=F[k],i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v)}render()}
function resetF(){F=Object.assign(F0(),{open:true});render()}
function chips(k,items){return`<div class="chips">${items.map(([v,l])=>`<button class="${(k==='g'?F.g===v:F[k].includes(v))?'on':''}" data-v="${esc(v)}" onclick="tg('${k}',this.dataset.v)">${esc(l)}</button>`).join('')}</div>`}
function filtH(){const sz=allSizes();
 return`<div class="box"><label>Стать</label>${chips('g',[['','Усі'],['m','Чоловіче'],['f','Жіноче']])}
 <label>Тип одягу</label>${chips('cats',D.s.cats.map(c=>[c,c]))}
 ${sz.length?`<label>Розмір</label>${chips('sz',sz.map(s=>[s,s]))}`:''}
 <label>Стан</label>${chips('cond',COND)}
 <label>Ціна (${esc(D.s.cur)})</label><div class="row"><input type="number" inputmode="decimal" placeholder="від" value="${esc(F.min)}" oninput="F.min=this.value;updGrid()"><input type="number" inputmode="decimal" placeholder="до" value="${esc(F.max)}" oninput="F.max=this.value;updGrid()"></div>
 <button style="width:100%" onclick="resetF()">Скинути фільтри</button></div>`}
function gridH(){const l=filt();
 return l.length?`<div class="grid">${l.map(p=>{const na=!avail(p);
  const lab=p.sold?'<span class="sold">Продано</span>':isRes(p)?'<span class="rsv">Заброньовано</span>':'';
  const bd=isSale(p)&&!na?`<span class="bdg">−${Math.round((1-p.sp/p.pr)*100)}%</span>`:'';
  return`<div class="c${na?' na':''}" onclick="openProd('${p.id}')"><div class="im">${p.im[0]?`<img src="${p.im[0]}" alt="" loading="lazy">`:'Немає фото'}</div>${lab}${bd}<div class="t"><b>${esc(p.n)}</b>${priceH(p)}${na?'':tmH(p)}</div></div>`}).join('')}</div>`:'<p style="color:var(--mut)">За вашими фільтрами нічого не знайдено.</p>'}
const cntT=()=>'Знайдено: '+filt().length+' з '+D.p.length;
function updGrid(){const g=document.getElementById('gl');if(!g)return;g.innerHTML=gridH();document.getElementById('cnt').textContent=cntT();tick()}
function shopV(){const n=fcount();
 return`<p style="color:var(--mut);margin-top:0">${esc(D.s.about)}</p>${promoH()}
 <div class="row" style="margin-bottom:8px"><input id="fq" placeholder="Пошук за назвою" value="${esc(F.q)}" oninput="F.q=this.value;updGrid()" style="margin:0"><button style="flex:none" onclick="F.open=!F.open;render()">⚙ Фільтри${n?' ('+n+')':''}</button></div>
 ${F.open?filtH():''}<p id="cnt" style="color:var(--mut);font-size:13px;margin:6px 0 10px">${cntT()}</p><div id="gl">${D.p.length?gridH():'<p>Товарів поки немає.</p>'}</div>${loggedIn?'':'<footer><a onclick="modal={t:\'login\'};render()">Вхід для адміністратора</a></footer>'}`}

/* ---------- кошик і акції ---------- */
function calc(){const L=[],U=[];
 cart.forEach((i,n)=>{const p=prod(i.id);if(!p)return;const l={n,p,size:i.size,q:i.q,price:effP(p),fq:0};L.push(l);for(let k=0;k<i.q;k++)U.push({l,price:l.price})});
 let gift=0;
 if(D.s.p3on){const s=U.slice().sort((a,b)=>b.price-a.price);   // у кожній трійці безкоштовною стає найдешевша, якщо вона в межах ліміту
  for(let i=2;i<s.length;i+=3)if(s[i].price<=D.s.p3max){s[i].l.fq++;gift+=s[i].price}}
 const sub=L.reduce((a,l)=>a+l.price*l.q,0);
 return{L,sub,gift,total:sub-gift,n:U.length}}
function lineH(l){return`<div class="box row"><div style="flex:3"><b>${esc(l.p.n)}</b><br>${l.size?`<small>Розмір ${esc(l.size)}</small><br>`:''}${priceH(l.p)}${l.fq?`<br><small style="color:#2e9e5b">🎁 безкоштовно × ${l.fq}</small>`:''}</div><div class="row" style="flex:2"><button onclick="qty(${l.n},-1)">−</button><span style="text-align:center">${l.q}</span><button onclick="qty(${l.n},1)">+</button></div></div>`}
const fv=i=>esc(modal.f&&modal.f[i]||'');
function fs(i,v){(modal.f=modal.f||{})[i]=v}
function openProd(id){const p=prod(id);modal={t:'prod',id,size:p.sz.length===1?p.sz[0]:null,k:0};render()}
function modalV(){if(!modal)return'';let h='';
 if(modal.t==='login')h=`<h2 style="margin-top:0">Вхід в адмін-панель</h2><label>Пароль</label><input id="lp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"><button class="p" style="width:100%" onclick="login()">Увійти</button>`;
 if(modal.t==='prod'){const p=prod(modal.id);if(!p){modal=null;return''}
  const meta=[gName(p.g),p.cat,cName(p.cond)].filter(Boolean).join(' · ');
  h=`<div class="big">${p.im[modal.k]?`<img src="${p.im[modal.k]}" alt="">`:'Немає фото'}</div><div class="th">${p.im.map((s,i)=>`<img src="${s}" onclick="modal.k=${i};render()" alt="">`).join('')}</div>
  <h2 style="margin:6px 0">${esc(p.n)}</h2><div style="font-size:18px">${priceH(p)}</div>${tmH(p)}
  ${meta?`<p style="color:var(--mut);font-size:13px;margin:8px 0 0">${esc(meta)}</p>`:''}<p>${esc(p.d).replace(/\n/g,'<br>')}</p>
  ${p.sz.length>1?`<label>Розмір</label><div class="sz">${p.sz.map((s,i)=>`<button class="${modal.size===s?'on':''}" onclick="pickSize(${i})">${esc(s)}</button>`).join('')}</div>`:p.sz.length===1?`<p><label>Розмір:</label> <b>${esc(p.sz[0])}</b></p>`:''}
  ${p.sold?'<button disabled style="width:100%">Продано</button>':isRes(p)?'<button disabled style="width:100%">Заброньовано</button>':`<button class="w" style="width:100%;margin-bottom:8px" onclick="addCart(true)">Купити</button><button class="p" style="width:100%" onclick="addCart(false)">Додати в кошик</button>`}`}
 if(modal.t==='cart'){const c=calc();
  h=`<h2 style="margin-top:0">Кошик</h2>`+(c.L.length?c.L.map(lineH).join('')
   +(D.s.p3on&&c.n%3===2?`<div class="ok">🎁 Додайте ще одну річ — і будь-яка третя вартістю до ${money(D.s.p3max)} буде безкоштовною!</div>`:'')
   +(c.gift?`<div>🎁 Подарунок: −${money(c.gift)}</div>`:'')
   +`<h3>Разом: <span class="pr">${money(c.total)}</span></h3>${D.s.fsOn?'<small style="color:var(--mut)">🚚 Безкоштовна доставка при повній передоплаті</small><br><br>':''}<button class="p" style="width:100%" onclick="modal={t:'co'};render()">Оформити замовлення</button>`:'<p>Кошик порожній</p>')}
 if(modal.t==='co'){const c=calc(),pre=modal.pay!=='cod',fs0=D.s.fsOn&&pre;
  h=`<h2 style="margin-top:0">Оформлення</h2><div class="box">${c.L.map(l=>`<div class="row"><span style="flex:3">${esc(l.p.n)}${l.size?', '+esc(l.size):''} × ${l.q}</span><span style="flex:2;text-align:right">${money(l.price*l.q)}</span></div>${l.fq?`<small style="color:#2e9e5b">🎁 безкоштовно × ${l.fq}</small>`:''}`).join('')}
  ${c.gift?`<div class="row"><span>Подарунок</span><span style="text-align:right">−${money(c.gift)}</span></div>`:''}
  <div class="row"><span>Доставка</span><span style="text-align:right">${fs0?'безкоштовно 🎁':'за тарифами перевізника'}</span></div>
  <h3 style="margin:8px 0 0">Разом: <span class="pr">${money(c.total)}</span></h3></div>
  <label>Спосіб оплати</label><div class="chips"><button class="${pre?'on':''}" onclick="modal.pay='pre';render()">Повна передоплата${D.s.fsOn?' · доставка безкоштовна 🎁':''}</button><button class="${pre?'':'on'}" onclick="modal.pay='cod';render()">Накладений платіж</button></div>
  ${pre?`<div class="box"><div>1. Переведіть <b class="pr">${money(c.total)}</b> на картку:</div><div class="card">${esc(D.s.card)||'(номер картки не вказано)'}</div><small>${esc(D.s.holder)}</small><br><button onclick="copyCard()">Скопіювати номер</button></div>`:`<div class="box">Оплата при отриманні. Доставку ви оплачуєте за тарифами перевізника.</div>`}
  <div>${pre?'2':'1'}. Дані для відправлення:</div>
  <label>Ім’я та прізвище</label><input oninput="fs(1,this.value)" value="${fv(1)}" autocomplete="name"><label>Телефон</label><input oninput="fs(2,this.value)" value="${fv(2)}" type="tel" autocomplete="tel"><label>Доставка</label><select onchange="fs(3,this.value)"><option${(modal.f&&modal.f[3])==='Укрпошта'?'':' selected'}>Нова пошта</option><option${(modal.f&&modal.f[3])==='Укрпошта'?' selected':''}>Укрпошта</option></select>
  <label>Місто</label><input oninput="fs(4,this.value)" value="${fv(4)}"><label>Відділення / індекс / адреса</label><input oninput="fs(5,this.value)" value="${fv(5)}"><label>Ваш Telegram (тег)</label><input oninput="fs(6,this.value)" value="${fv(6)}" placeholder="@username" autocapitalize="none"><label>Коментар</label><textarea oninput="fs(7,this.value)" rows="2">${fv(7)}</textarea>
  <button class="p" style="width:100%" onclick="send()">${pre?'3':'2'}. Надіслати замовлення продавцю в Telegram</button>`}
 if(modal.t==='done')h=`<h2 style="margin-top:0">Майже готово ✅</h2><p>Відкрився Telegram із готовим повідомленням. Натисніть «Надіслати» в чаті з продавцем. Товари заброньовано за вами. Якщо чат не відкрився, скопіюйте замовлення й надішліть вручну:</p><textarea rows="8" readonly>${esc(modal.txt)}</textarea><button onclick="copyTxt()">Скопіювати</button>`;
 return`<div class="ov" onclick="if(event.target===this){modal=null;render()}"><div class="md">${h}<br><button style="width:100%;margin-top:8px" onclick="modal=null;render()">Закрити</button></div></div>`}
function pickSize(i){modal.size=prod(modal.id).sz[i];render()}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>status('Скопійовано'),()=>status('Не вдалося скопіювати',1))}catch(e){status('Не вдалося скопіювати',1)}}
function copyCard(){copy((D.s.card||'').replace(/\s/g,''))}
function copyTxt(){copy(modal.txt)}
function addCart(go){const p=prod(modal.id);if(!avail(p)){status('Цей товар уже недоступний',1);return}
 const sz=p.sz.length===1?p.sz[0]:modal.size;           // якщо розмір один — обирати не потрібно
 if(p.sz.length>1&&!sz){status('Оберіть розмір',1);return}
 const f=cart.find(i=>i.id===p.id&&i.size===(sz||null));f?f.q++:cart.push({id:p.id,size:sz||null,q:1});
 if(go)modal={t:'co'};else{modal=null;status('Додано в кошик ✓')}
 render()}
function qty(n,d){cart[n].q+=d;if(cart[n].q<1)cart.splice(n,1);render()}
async function send(){if(busy)return;const f=modal.f||{},v=i=>(f[i]||'').trim(),pre=modal.pay!=='cod';
 if(!v(1)||!v(2)||!v(4)||!v(5)||!v(6)){alert('Заповніть ім’я, телефон, місто, відділення та Telegram');return}
 if(!D.s.tg){alert('Продавець ще не вказав Telegram');return}
 purge();if(!cart.length){modal={t:'cart'};render();return}
 busy=true;
 const ids=[...new Set(cart.map(i=>i.id))];
 try{
  if(base()){
   for(const id of ids){                                   // перевіряємо, що товар ще вільний
    const [r,s]=await Promise.all([cget('/shop/r/'+id),cget('/shop/p/'+id+'/sold')]);
    if(r||s){if(r)D.r[id]=r;if(s)prod(id).sold=true;busy=false;status('Хтось щойно встиг замовити один із товарів',1);purge();modal={t:'cart'};render();return}}
   const ts=Date.now();
   await Promise.all(ids.map(id=>cput('/shop/r/'+id,ts)));  // ставимо бронь
  }
  const ts=Date.now();ids.forEach(id=>D.r[id]=ts);idbSet(D);
 }catch(e){status('Не вдалося забронювати в хмарі, але замовлення буде надіслано',1)}
 busy=false;
 const c=calc(),cur=D.s.cur;
 const txt=`🛍 Нове замовлення\n`+c.L.map((l,n)=>`${n+1}) ${l.p.n}${l.size?', розмір '+l.size:''} × ${l.q} — ${l.price*l.q} ${cur}${l.fq?' (🎁 безкоштовно × '+l.fq+')':''}`).join('\n')
  +`\nРазом: ${c.total} ${cur}\n\nІм’я: ${v(1)}\nТелефон: ${v(2)}\nДоставка: ${f[3]||'Нова пошта'}, ${v(4)}, ${v(5)}\nTelegram: ${v(6)}${v(7)?'\nКоментар: '+v(7):''}\n`
  +(pre?'Оплата: повна передоплата на картку'+(D.s.fsOn?' (доставка безкоштовна)':''):'Оплата: накладений платіж (доставка за тарифами перевізника)');
 const url='https://t.me/'+D.s.tg.replace('@','')+'?text='+encodeURIComponent(txt);
 cart=[];modal={t:'done',txt};render();
 location.href=url}

/* ---------- оновлення броней у реальному часі ---------- */
async function poll(){if(!base()||document.hidden||busy)return;
 try{const r=norm({r:await cget('/shop/r')}).r;
  if(JSON.stringify(r)!==JSON.stringify(D.r)){D.r=r;idbSet(D);if(!isTyping())render()}}catch(e){}}
setInterval(poll,15000);

/* ---------- адмінка ---------- */
function setS(k,v){D.s[k]=v;mark('s')}
function setCats(v){D.s.cats=v.split(',').map(s=>s.trim()).filter(Boolean);mark('s')}
function upd(id,k,v){prod(id)[k]=v;mark('p',id)}
function updSz(id,v){upd(id,'sz',v.split(',').map(s=>s.trim()).filter(Boolean))}
const opts=(list,cur)=>list.map(([v,l])=>`<option value="${esc(v)}"${v===cur?' selected':''}>${esc(l)}</option>`).join('');
function adminV(){
 const cl=base();
 let h=cl?`<div class="ok">☁ Хмару підключено: зміни зберігаються автоматично й одразу видні всім за посиланням.</div>`
  :`<div class="warn">⚠ Хмару не підключено: правки зберігаються лише на цьому пристрої, покупці їх не побачать (і броні теж не працюватимуть для інших). Підключіть хмару у вкладці «Налаштування».</div>`;
 h+=`<div class="tabs"><button class="${tab==='p'?'on':''}" onclick="tab='p';render()">Товари</button><button class="${tab==='s'?'on':''}" onclick="tab='s';render()">Налаштування</button></div>`;
 if(tab==='s'){
  const f=(k,l)=>`<label>${l}</label><input value="${esc(D.s[k])}" onchange="setS('${k}',this.value)">`;
  h+=f('name','Назва магазину')+`<div class="box"><b>🖼 Логотип</b>${D.s.logo?`<img src="${D.s.logo}" style="height:48px;display:block;margin:8px 0" alt="">`:''}<label style="display:block;margin-top:6px">Завантажте логотип — він з’явиться ліворуч від назви</label><input type="file" accept="image/*" onchange="addLogo(this.files[0])">${D.s.logo?`<button class="d" onclick="setS('logo','');render()">Прибрати логотип</button>`:''}</div>`
   +`<label>Колір сайту</label><input type="color" value="${esc(D.s.color)}" oninput="setS('color',this.value)" style="height:46px;padding:4px">`
   +f('about','Опис під назвою')+f('tg','Ваш Telegram (без @), куди надходять замовлення')+f('card','Номер картки для оплати')+f('holder','Отримувач (ім’я на картці)')+f('cur','Валюта')
   +`<label>Типи одягу для фільтра (через кому)</label><input value="${esc(D.s.cats.join(', '))}" onchange="setCats(this.value)">`
   +`<div class="box"><b>🎁 Акції</b><label style="display:block;margin:10px 0 6px"><input type="checkbox" ${D.s.p3on?'checked':''} onchange="setS('p3on',this.checked)">Третя річ у подарунок при купівлі двох</label><label>Максимальна ціна подарункової речі</label><input type="number" inputmode="decimal" value="${D.s.p3max}" onchange="setS('p3max',+this.value||0)"><label style="display:block"><input type="checkbox" ${D.s.fsOn?'checked':''} onchange="setS('fsOn',this.checked)">Безкоштовна доставка при повній передоплаті</label></div>`
   +`<div class="box"><b>☁ Хмара (щоб зміни були видні всім)</b>
   <ol style="font-size:14px"><li>Зайдіть на <b>console.firebase.google.com</b> → створіть проєкт (безкоштовно).</li><li>Build → <b>Realtime Database</b> → Create database → режим <b>test mode</b> (або в Rules поставте <code>{"rules":{".read":true,".write":true}}</code>).</li><li>Скопіюйте адресу бази виду <code>https://назва-default-rtdb.firebaseio.com</code> і вставте нижче.</li></ol>
   <label>Адреса бази</label><input id="dburl" value="${esc(LS.get('dburl')||DB_URL)}" placeholder="https://...firebaseio.com" autocapitalize="none">
   <div class="row"><button class="p" onclick="connect()">Підключити й перевірити</button><button onclick="dlFile()">⬇ Завантажити файл із підключенням</button></div>
   <small style="color:var(--mut)">Після підключення завантажте файл і викладіть його на хостинг. Цей файл і буде вашим сайтом та адмінкою.</small></div>`
   +`<div class="box"><b>🔑 Змінити пароль</b><label>Поточний пароль</label><input id="pw0" type="password"><label>Новий пароль (мінімум 6 символів)</label><input id="pw1" type="password"><label>Повторіть новий пароль</label><input id="pw2" type="password"><button onclick="chpw()">Змінити пароль</button></div>
   <button class="d" style="width:100%" onclick="logout()">Вийти з адмінки</button>`}
 else{
  const cats=[['','— не вказано —'],...D.s.cats.map(c=>[c,c])];

   const cs=p.cat&&!D.s.cats.includes(p.cat)?[...cats,[p.cat,p.cat]]:cats;
   const sale=p.sp>0?(p.sp<p.pr?(isSale(p)?`Знижка −${Math.round((1-p.sp/p.pr)*100)}% діє зараз`:'Термін знижки минув — вона не діє'):'<span style="color:#d33">Ціна зі знижкою має бути меншою за звичайну</span>'):'';
   return`<div class="box"><div class="row"><div><label>Назва</label><input value="${esc(p.n)}" onchange="upd('${p.id}','n',this.value)"></div><div><label>Ціна</label><input type="number" inputmode="decimal" value="${p.pr}" onchange="upd('${p.id}','pr',+this.value)"></div></div>
  <div class="row"><div><label>Ціна зі знижкою (необов’язково)</label><input type="number" inputmode="decimal" value="${p.sp||''}" placeholder="без знижки" onchange="upd('${p.id}','sp',+this.value||0)"></div><div><label>Знижка діє до (необов’язково)</label><input type="datetime-local" value="${p.se?locIn(p.se):''}" onchange="upd('${p.id}','se',this.value?new Date(this.value).getTime():0)"></div></div>

  <div class="row" style="margin-top:8px"><div><label>Стать</label><select onchange="upd('${p.id}','g',this.value)">${opts([['','— не вказано —'],...GEN],p.g)}</select></div><div><label>Тип одягу</label><select onchange="upd('${p.id}','cat',this.value)">${opts(cs,p.cat)}</select></div><div><label>Стан</label><select onchange="upd('${p.id}','cond',this.value)">${opts([['','— не вказано —'],...COND],p.cond)}</select></div></div>

  <button class="d" style="width:100%;margin-top:8px" onclick="delP('${p.id}')">Видалити</button></div>`}).join('')}
 return h}
function newP(){D.p.unshift({id:'p'+Date.now(),t:Date.now(),n:'Новий товар',pr:0,d:'',sz:['S','M','L'],im:[],sold:false,g:'u',cat:D.s.cats[0]||'',cond:'new',sp:0,se:0});mark('p',D.p[0].id);render()}
function toggleSold(id){const p=prod(id);p.sold=!p.sold;mark('p',id);render()}
async function setRes(id,on){if(on)D.r[id]=Date.now();else delete D.r[id];idbSet(D);
 if(!base()){status('Збережено на цьому пристрої');return}
 try{if(on)await cput('/shop/r/'+id,D.r[id]);else await cdel('/shop/r/'+id);status(on?'Забронювано ✓':'Бронь знято ✓')}
 catch(e){status('Не вдалося зберегти бронь у хмарі',1)}}
function delImg(id,i){prod(id).im.splice(i,1);mark('p',id);render()}
function delP(id){if(confirm('Видалити товар?')){D.p=D.p.filter(x=>x.id!==id);delete D.r[id];mark('del',id);render()}}
function shrink(file,max,type){return new Promise((r,j)=>{const i=new Image,u=URL.createObjectURL(file);i.onload=()=>{const k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);r(type==='png'?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.75))};i.onerror=()=>j();i.src=u})}
async function addImg(id,files){status('Завантаження фото…');for(const f of files){try{prod(id).im.push(await shrink(f,1000,'jpeg'))}catch(e){status('Не вдалося прочитати фото',1)}}mark('p',id);render()}
async function addLogo(f){if(!f)return;try{D.s.logo=await shrink(f,240,'png');mark('s');render()}catch(e){status('Не вдалося прочитати зображення',1)}}
async function connect(){const u=document.getElementById('dburl').value.trim().replace(/\/+$/,'');
 if(!u){LS.del('dburl');status('Хмару відключено');render();return}
 if(!/^https:\/\/.+/.test(u)){status('Адреса має починатися з https://',1);return}
 LS.set('dburl',u);
 try{const c=await cloudLoad();
  if(c&&c.s){if(confirm('У хмарі вже є дані магазину. Завантажити їх сюди? (Скасувати — перезаписати хмару поточними даними)')){D=norm(c);idbSet(D)}else{markAll();await flush()}}
  else{markAll();await flush()}
  status('Хмару підключено ✓');render()
 }catch(e){status('Не вдалося підключитися. Перевірте адресу й правила бази',1)}}
async function chpw(){const g=i=>document.getElementById(i).value;
 if(hp(g('pw0'))!==curHash()){status('Поточний пароль невірний',1);return}
 if(g('pw1').length<6){status('Новий пароль занадто короткий',1);return}
 if(g('pw1')!==g('pw2')){status('Паролі не збігаються',1);return}
 D.s.ph=hp(g('pw1'));LS.set('adm',D.s.ph);mark('s');status('Пароль змінено ✓');render()}
function dlFile(){const u=(LS.get('dburl')||DB_URL||'').trim();
 if(!u){status('Спочатку підключіть хмару',1);return}
 const h=SRC.replace(/const DB_URL='[^']*';/,()=>"const DB_URL='"+u.replace(/'/g,'')+"';");
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();a.remove()}
window.addEventListener('hashchange',()=>{if(location.hash==='#admin'&&!loggedIn){modal={t:'login'};render()}});
init();
</script></body></html>
